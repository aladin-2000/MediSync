spring.application.name=medisync

# ─── Datasource MySQL ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/medisync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ─── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ─── JWT ───────────────────────────────────────────────────────────────────────
# En production : définir la variable d'environnement JWT_SECRET (ne jamais committer la vraie valeur).
# La valeur ci-dessous est un fallback pour le développement local uniquement.
jwt.secret=${JWT_SECRET:TFwKTC9Gzc/mvVHUCDZ3ncoxuZFvxy68M9+sP3zVxA0=}
jwt.expiration-ms=86400000

# ─── Délégué de test (dev uniquement) ──────────────────────────────────────────
# Créé automatiquement au démarrage s'il n'existe pas déjà. Vider test.delegue.password pour désactiver.
test.delegue.email=delegue.test@medisync.tn
test.delegue.password=Test123!

# ─── Médecin de test (dev uniquement) ──────────────────────────────────────────
